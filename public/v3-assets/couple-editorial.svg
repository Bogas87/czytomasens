<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Dwie osoby w spokojnej, abstrakcyjnej kompozycji</title>
  <desc id="desc">Subtelna, neutralna płciowo ilustracja pary w ciemnej stylistyce z delikatnym złotym światłem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090b"/>
      <stop offset="0.6" stop-color="#0d1013"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#dcb469" stop-opacity=".26"/>
      <stop offset=".52" stop-color="#dcb469" stop-opacity=".07"/>
      <stop offset="1" stop-color="#dcb469" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf8e" stop-opacity=".86"/>
      <stop offset="1" stop-color="#a77a38" stop-opacity=".48"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="1400" fill="url(#bg)"/>
  <ellipse cx="450" cy="655" rx="405" ry="500" fill="url(#glow)"/>
  <ellipse cx="334" cy="465" rx="155" ry="190" fill="#c99646" opacity=".06" filter="url(#blur)"/>
  <ellipse cx="568" cy="470" rx="160" ry="195" fill="#c99646" opacity=".06" filter="url(#blur)"/>

  <!-- person left -->
  <path d="M205 1045 C235 875 248 777 282 683 C304 621 333 589 366 575 C317 543 293 499 294 446 C295 367 347 309 417 309 C478 309 524 351 533 413 C539 455 525 498 492 528 C475 543 455 554 433 561 C465 582 489 612 503 651 C534 738 551 867 576 1045 Z" fill="#0a0d10" stroke="url(#line)" stroke-width="3"/>
  <path d="M298 438 C307 363 350 326 414 326 C459 326 494 349 514 385 C475 371 444 365 410 372 C363 381 329 402 298 438 Z" fill="#15110c" opacity=".8"/>

  <!-- person right -->
  <path d="M378 1045 C398 902 419 781 449 685 C468 624 496 589 532 570 C489 537 469 493 473 439 C480 359 536 304 606 311 C669 317 712 364 715 426 C718 470 699 510 665 538 C648 552 628 562 608 567 C643 587 667 620 680 660 C708 747 720 872 735 1045 Z" fill="#0c0f12" stroke="url(#line)" stroke-width="3"/>
  <path d="M483 433 C494 365 542 327 603 330 C648 332 680 354 699 389 C661 375 628 371 596 377 C548 385 514 404 483 433 Z" fill="#15110c" opacity=".78"/>

  <!-- connection / shared field -->
  <path d="M405 617 C443 594 475 594 510 616" fill="none" stroke="#e6bc70" stroke-width="2.4" stroke-linecap="round" opacity=".66"/>
  <circle cx="457" cy="607" r="5.5" fill="#f0cf8e" opacity=".92"/>
  <circle cx="457" cy="607" r="27" fill="none" stroke="#dcb469" stroke-width="1" opacity=".18"/>
  <circle cx="457" cy="607" r="62" fill="none" stroke="#dcb469" stroke-width="1" opacity=".10"/>

  <!-- quiet architectural lines -->
  <path d="M108 1185 H792" stroke="#dcb469" stroke-opacity=".14"/>
  <path d="M156 1228 H744" stroke="#ffffff" stroke-opacity=".05"/>
  <path d="M450 163 V256" stroke="#dcb469" stroke-opacity=".15"/>
  <circle cx="450" cy="145" r="3" fill="#efc97e"/>
  <circle cx="450" cy="145" r="24" fill="none" stroke="#dcb469" stroke-opacity=".13"/>
</svg>
